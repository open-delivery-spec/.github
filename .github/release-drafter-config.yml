# Shared Release Drafter config for open-delivery-spec org
# Referenced by repos via: config-name: open-delivery-spec/.github:release-drafter-config.yml
# https://github.com/release-drafter/release-drafter

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 💥 Breaking changes
    labels:
      - breaking
  - title: 🚀 Features
    labels:
      - feature
      - enhancement
  - title: 🐛 Bug fixes
    labels:
      - bug
      - bugfix
      - fix
      - regression
  - title: 📝 Documentation
    labels:
      - documentation
  - title: 🚦 Tests
    labels:
      - test
      - tests
  - title: 👻 Maintenance
    labels:
      - chore
      - internal
      - maintenance
  - title: 📦 Dependencies
    labels:
      - dependencies
    collapse-after: 15
  - title: 🗑 Removed
    labels:
      - removed
      - deprecated
  - title: ✍ Other changes

exclude-labels:
  - no-changelog
  - skip-changelog
  - invalid
  - duplicate
  - question
  - wontfix

change-template: '- $TITLE by @$AUTHOR in #$NUMBER'

# Pre-1.0: a breaking change bumps the minor version (0.7 -> 0.8). Move
# `breaking` under `major` when the CLI reaches 1.0.
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
      - breaking
  patch:
    labels:
      - patch
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  # ── Breaking changes: the Conventional Commits `!` marker or footer ──
  # A `refactor!:` title matches none of the type rules below (they stop at
  # the colon), so without this rule a breaking change lands in "Other
  # changes" and the drafter proposes a patch bump.
  - label: breaking
    title:
      - /^\w+(\(.*\))?!:.*/
    body:
      - /BREAKING CHANGE:/

  # ── Title-based (conventional commit prefix) ──────────────
  - label: enhancement
    title:
      - /^feat(\(.*\))?:.*/
      - /^feature(\(.*\))?:.*/
      - /^perf(\(.*\))?:.*/
  - label: bug
    title:
      - /^fix(\(.*\))?:.*/
      - /^bugfix(\(.*\))?:.*/
  - label: documentation
    title:
      - /^docs(\(.*\))?:.*/
  - label: chore
    title:
      - /^chore(\(.*\))?:.*/
      - /^refactor(\(.*\))?:.*/
      - /^ci(\(.*\))?:.*/
      - /^style(\(.*\))?:.*/
      - /^build(\(.*\))?:.*/
      - /^revert(\(.*\))?:.*/
  - label: tests
    title:
      - /^test(\(.*\))?:.*/
      - /^tests(\(.*\))?:.*/

  # ── Branch-based ──────────────────────────────────────────
  - label: enhancement
    branch:
      - /^feature\/.+/
      - /^feat\/.+/
  - label: bug
    branch:
      - /^fix\/.+/
      - /^bugfix\/.+/
  - label: chore
    branch:
      - /^chore\/.+/
  - label: tests
    branch:
      - /^test\/.+/


