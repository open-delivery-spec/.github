# ODS Validate — Dogfooding workflow for the organization's .github repository
#
# Runs the ODS AI code quality gate on every PR to main, with the same
# open-source disclosure policy every repository in the organization uses
# (.ods/policy.rego, a copy of the spec's examples/ods-policy-oss-disclosure.rego).

name: ODS Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # the ODS comment, the review-tier label, reviewer requests

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The PR head by SHA: the real commits under review rather than the
          # synthetic merge commit, and it resolves for pull requests from
          # forks too — github.head_ref is a branch that exists only in the fork.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Conventional branch & commit checks
        run: |
          python3 -m pip install 'commit-check>=2.9.0'
          commit-check --message --branch

      # Disclose it, test it, own it. Review routing labels the PR with its
      # tier and asks a maintainer to look at changes the policy marks elevated.
      - name: ODS AI code quality gate
        uses: open-delivery-spec/validate-action@v1
        with:
          diff-base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          branch: ${{ github.head_ref }}
          summary: 'true'
          comment: 'true'
          review-routing: 'true'
          elevated-reviewers: 'shenxianpeng'
